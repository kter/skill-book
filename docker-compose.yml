services:
  db:
    image: postgres:16-alpine
    container_name: skill-book-db
    environment:
      POSTGRES_USER: skillbook
      POSTGRES_PASSWORD: skillbook
      POSTGRES_DB: skillbook
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillbook"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
